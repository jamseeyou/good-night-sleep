<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创作 - 今晚怎么睡？🌙</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #0f172a; /* 深夜暗蓝色背景 */
      color: #ffffff;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    /* 移动端主容器 (适配 375px-430px) */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 80px;
      overflow-y: auto;
      gap: 16px;
    }

    /* 1. 搜索框 */
    .search-bar {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }
    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      width: 60%;
      text-align: center;
    }

    /* 2. 类目可滑动板块 */
    .category-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none; /* 隐藏滚动条 */
      padding-bottom: 4px;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    
    .chip {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
    }
    .chip.active {
      background: rgba(255, 255, 255, 0.3);
      border-color: #ffffff;
      font-weight: bold;
    }

    /* 3. 可滑动视频列表 */
    .video-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .video-card {
      min-width: 110px;
      height: 80px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 4. 操作与定时栏 */
    .controls-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group-sm {
      display: flex;
      gap: 8px;
    }
    .btn-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-glass {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 6px 16px;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    /* 5. 主视频展示与右侧音量调节区域 */
    .player-section {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .video-display {
      flex: 1;
      height: 200px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-display video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* 柱状图形音量条 (Vertical Slider) */
    .volume-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      height: 200px;
      justify-content: space-between;
    }
    .volume-label {
      font-size: 11px;
      writing-mode: vertical-lr;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 2px;
    }
    .volume-slider {
      -webkit-appearance: slider-vertical; /* 垂直滑动条 */
      width: 12px;
      height: 150px;
      accent-color: #ffffff;
    }

    /* 6. 底部剪辑与播放操作按钮 */
    .action-bar {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
    }
    .btn-action {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 10px 24px;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    /* 7. 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 65px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      gap: 4px;
    }
    .nav-item.active {
      color: #ffffff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="search-bar">
      🔍 <input type="text" placeholder="去搜索，添加视频">
    </div>

    <div class="category-scroll">
      <div class="chip active">人声&口腔音</div>
      <div class="chip">白噪音</div>
      <div class="chip">场景扮演</div>
      <div class="chip">敲击音</div>
      <div class="chip">自然雨声</div>
    </div>

    <div class="video-list">
      <div class="video-card">视频 A</div>
      <div class="video-card">视频 B</div>
      <div class="video-card">视频 C</div>
      <div class="video-card">视频 D</div>
    </div>

    <div class="controls-top">
      <div class="btn-group-sm">
        <button class="btn-circle" title="添加视频">+</button>
        <button class="btn-circle" title="删除视频">-</button>
      </div>
      <button class="btn-glass" id="timer-btn" onclick="setTimer()">⏱ 定时: 关</button>
    </div>

    <div class="player-section">
      <div class="video-display">
        <video id="main-video" autoplay loop muted playsinline src="rain_cozy_room.mp4"></video>
      </div>
      
      <div class="volume-container">
        <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeVolume(this.value)">
        <span class="volume-label">音量</span>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn-action">裁剪</button>
      <button class="btn-action" onclick="togglePlay()">播放 / 暂停</button>
      <button class="btn-action">保存</button>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🌙</span>
      <span>主页</span>
    </a>
    <a href="create.html" class="nav-item active">
      <span>＋</span>
      <span>创作</span>
    </a>
    <a href="#" class="nav-item">
      <span>👤</span>
      <span>我的</span>
    </a>
  </nav>

  <script>
    const video = document.getElementById('main-video');

    // 音量调节
    function changeVolume(val) {
      video.volume = val;
      if (val > 0) video.muted = false;
    }

    // 播放/暂停切换
    function togglePlay() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    // 定时器简易逻辑 (30m, 1h, 1.5h)
    let timerState = 0;
    const times = ["关", "30min", "1h", "1.5h"];
    function setTimer() {
      timerState = (timerState + 1) % times.length;
      document.getElementById('timer-btn').innerText = `⏱ 定时: ${times[timerState]}`;
    }
  </script>
</body>
</html>
