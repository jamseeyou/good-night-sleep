<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今晚怎么睡？🌙</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 背景纯画面视频层（静音，100% 自动播放成功） */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }
    .video-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
    }

    /* 主体内容容器 */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      padding: 20px 24px 80px; 
      position: relative;
      z-index: 10;
    }

    /* 头部 Title 区域 */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .moon-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 1.5px;
    }
    .welcome {
      font-size: 20px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }
    .sub-title {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 10px;
    }

    /* 心情选择主要区域 */
    .mood-section {
      width: 100%;
      text-align: center;
    }
    .section-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 16px;
      color: #ffffff;
    }

    .mood-container {
      width: 100%;
      transition: all 0.5s ease;
      opacity: 1;
      transform: translateY(0);
    }
    .mood-container.fade-out {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    .mood-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .mood-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
    .mood-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .mood-btn .icon {
      font-size: 18px;
    }
    .mood-btn h4 {
      font-size: 14px;
      color: #ffffff;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .response-card {
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      width: 100%;
    }
    .response-card.fade-in {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
    .response-text {
      font-size: 15px;
      color: #ffffff;
      font-weight: 500;
      line-height: 1.6;
    }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 65px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      gap: 4px;
    }
    .nav-item.active {
      color: #ffffff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="video-background">
    <video autoplay loop muted playsinline>
      <source src="./home.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
  </div>

  <main class="app-container">
    <header class="header">
      <div class="moon-icon">🌙</div>
      <h1>GOOD NIGHT</h1>
      <p class="welcome">welcome back</p>
      <p class="sub-title">今天怎么睡？</p>
    </header>

    <section class="mood-section">
      <h3 class="section-title">今天心情如何？</h3>
      
      <div class="mood-container" id="mood-options">
        <div class="mood-list">
          
          <div class="mood-btn" onclick="handleMoodSelect('good')">
            <span class="icon">😊</span>
            <h4>非常好！</h4>
          </div>

          <div class="mood-btn" onclick="handleMoodSelect('good')">
            <span class="icon">😌</span>
            <h4>还不错</h4>
          </div>

          <div class="mood-btn" onclick="handleMoodSelect('bad')">
            <span class="icon">🌧</span>
            <h4>真是太糟糕了…</h4>
          </div>

        </div>
      </div>

      <div class="response-card" id="response-card">
        <p class="response-text" id="response-text"></p>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">🌙</span>
      <span>主页</span>
    </a>
    <a href="create.html" class="nav-item">
      <span class="nav-icon">＋</span>
      <span>创作</span>
    </a>
    <a href="my.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </a>
  </nav>

  <script>
    // 2. 独立音频控制：利用 JS 创建 Audio 对象加载 home.mp3
    const bgAudio = new Audio('./home.mp3');
    bgAudio.loop = true; // 设置循环播放
    bgAudio.volume = 0.8; // 可以自由调整音量 (0.0 - 1.0)

    // 页面加载后尝试播放音频
    window.addEventListener('DOMContentLoaded', () => {
      bgAudio.play().catch(error => {
        console.log("浏览器拦截了自动声音，等待用户点击交互后解锁...");
        // 绑定首次点击或触摸事件来瞬间唤醒声音
        const unlockAudio = () => {
          bgAudio.play();
          document.removeEventListener('click', unlockAudio);
          document.removeEventListener('touchstart', unlockAudio);
        };
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);
      });
    });

    function handleMoodSelect(type) {
      const optionsBox = document.getElementById('mood-options');
      const responseCard = document.getElementById('response-card');
      const responseText = document.getElementById('response-text');

      if (type === 'good') {
        responseText.innerText = "真不错，调个喜欢的声音好好休息吧~ ✨";
      } else {
        responseText.innerText = "没关系，今晚做个好梦，调个喜欢的 ASMR 入睡吧~ 🌙";
      }

      optionsBox.classList.add('fade-out');

      setTimeout(() => {
        optionsBox.style.display = 'none';
        responseCard.classList.add('fade-in');
      }, 300);

      setTimeout(() => {
        window.location.href = "create.html";
      }, 1800);
    }
  </script>
</body>
</html>
