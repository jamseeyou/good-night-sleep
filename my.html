<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 - 今晚怎么睡？🌙</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 🌟 全局容器：全屏写实星空与底部月球背景 */
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('planet3.jpg'); /* 背景图片 */
      background-repeat: no-repeat;
      background-position: center bottom;   /* 确保星球紧贴最底部 */
      background-size: cover;              /* 自适应覆盖整个手机屏幕 */
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;                  /* 垂直居中整个 App 内容 */
      overflow: hidden;
      position: relative;
    }

    /* 移动端主内容容器 (利用 Flex 垂直居中内容组件) */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;              /* 核心修改：让播放器等主体垂直居于屏幕中部 */
      padding: 20px 16px 100px;             /* 底部留出悬浮播放按钮与导航栏空间 */
      gap: 20px;
      position: relative;
      z-index: 10;
      box-sizing: border-box;
    }

    /* 顶部导航与鼓励 */
    .header-my {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 5px;
    }

    /* 三段式 Grid 布局，完美保证 GOOD NIGHT 绝对居中 */
    .top-bar-my {
      display: grid;
      grid-template-columns: 80px 1fr 80px;  /* 左右各留 80px 宽度的对齐空间 */
      align-items: center;
      width: 100%;
    }

    .back-to-create {
      justify-self: start;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 6px 10px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    /* 1. GOOD NIGHT 文本精准居中 */
    .title-goodnight {
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    /* 2. 随机一句话：字号加大、居中 */
    .random-quote {
      font-size: 15px;                      /* 字号加大 */
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      line-height: 1.4;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      padding: 0 10px;
    }

    /* 3. 主视频预览区（居于屏幕中心区域） */
    .draft-display {
      width: 100%;
      height: 210px;                         /* 适当调大主卡片比例 */
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .draft-display img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .empty-display-hint {
      position: absolute;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      line-height: 1.6;
      padding: 0 20px;
    }

    /* 日期月球滑动栏 */
    .date-scroll-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .scroll-hint {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      text-align: center;
    }
    .date-scroll-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 4px;
      scrollbar-width: none;
      align-items: center;
    }
    .date-scroll-track::-webkit-scrollbar { display: none; }

    .moon-date {
      width: 54px;
      height: 54px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.3s ease;
      position: relative;
      backdrop-filter: blur(4px);
    }
    .moon-date.active {
      background: rgba(99, 102, 241, 0.45);
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
    }
    .moon-date .date-num {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
    }
    .moon-date .date-label {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.75);
    }
    .moon-date.active::after {
      content: '✓';
      position: absolute;
      top: -3px;
      right: -3px;
      background: #4ade80;
      color: white;
      font-size: 10px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* 🌟 悬浮在底部月球上的播放按钮包裹区 */
    .planet-player-wrapper {
      position: fixed;
      bottom: 80px;                         /* 位于底部导航栏上方 */
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 430px;
    }

    /* 播放按钮样式 */
    .play-btn-capsule {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 10px 28px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      transition: all 0.2s ease;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn-capsule:active {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0.96);
    }

    /* 底部固定导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 65px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      gap: 4px;
    }
    .nav-item.active {
      color: #ffffff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="header-my">
      <div class="top-bar-my">
        <a href="create.html" class="back-to-create">← 去创作</a>
        <div class="title-goodnight">Good Night</div>
        <div></div> </div>
      <p class="random-quote" id="random-quote">你很安全，你被爱着，现在可以安心休息</p>
    </header>

    <div class="draft-display" id="draft-display">
      <div class="empty-display-hint">该日期暂无剪辑工程。<br>左右滑动下方月球切换日期。</div>
    </div>

    <div class="date-scroll-section">
      <p class="scroll-hint">左右滑动月球解锁对应日期的视频工程 (保留近10天)</p>
      <div class="date-scroll-track" id="date-scroll-track">
      </div>
    </div>

  </div>

  <div class="planet-player-wrapper">
    <button class="play-btn-capsule" onclick="playSelectedDateProject()">播放该日ASMR工程</button>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🌙</span>
      <span>主页</span>
    </a>
    <a href="create.html" class="nav-item">
      <span>＋</span>
      <span>创作</span>
    </a>
    <a href="my.html" class="nav-item active">
      <span>👤</span>
      <span>我的</span>
    </a>
  </nav>

  <script>
    // 鼓励句子库
    const quotes = [
      "好好休息，明天会是新的开始",
      "今天的你已经很努力了，现在该休息了",
      "闭上眼睛，让平静找到你",
      "愿你的梦温柔又美好",
      "你很安全，你被爱着，现在可以安心休息",
      "放下烦恼，拥抱安静的夜晚",
      "宁静的夜晚正在等待你，好梦",
      "让思绪慢下来，让心安静下来"
    ];

    let currentDateIndex = 9; // 默认选中最后一天（今天）
    let availableDates = [];

    // 初始化
    function initMyPage() {
      // 1. 设置随机句子
      const quoteEl = document.getElementById('random-quote');
      quoteEl.innerText = quotes[Math.floor(Math.random() * quotes.length)];

      // 2. 生成近 10 天日期数据
      generateDateMoons();
    }

    // 生成日期月球并设置选中状态
    function generateDateMoons() {
      const track = document.getElementById('date-scroll-track');
      track.innerHTML = ''; 
      
      const today = new Date();
      availableDates = [];

      // 生成近 10 天日期
      for (let i = 9; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        availableDates.push({
          dateObj: d,
          dayNum: d.getDate(),
          monthLabel: (d.getMonth() + 1) + '/' + d.getDate(),
          storageKey: `asmr_project_${d.toISOString().split('T')[0]}`
        });
      }

      // 渲染
      availableDates.forEach((date, idx) => {
        const moon = document.createElement('div');
        moon.className = `moon-date ${idx === currentDateIndex ? 'active' : ''}`;
        moon.onclick = () => selectDateIndex(idx);
        moon.innerHTML = `
          <div class="date-num">${date.dayNum}</div>
          <div class="date-label">${idx === 9 ? '今天' : date.monthLabel}</div>
        `;
        track.appendChild(moon);
      });

      // 加载选定日期的工程数据
      loadProjectForDate(currentDateIndex);
    }

    // 选中日期时的交互
    function selectDateIndex(index) {
      currentDateIndex = index;
      generateDateMoons(); 
    }

    // 读取并加载指定日期的视频工程封面图
    function loadProjectForDate(index) {
      const display = document.getElementById('draft-display');
      const dateData = availableDates[index];
      
      const projectData = localStorage.getItem(dateData.storageKey);

      if (projectData) {
        display.innerHTML = '<img src="path/to/project_cover.jpg" alt="project cover">';
      } else {
        display.innerHTML = `<div class="empty-display-hint">
          ${dateData.monthLabel}该日期暂无剪辑工程。<br>去“创作”页面剪辑并保存一个吧！
        </div>`;
      }
    }

    // 播放指定日期的工程
    function playSelectedDateProject() {
      const dateData = availableDates[currentDateIndex];
      const projectData = localStorage.getItem(dateData.storageKey);

      if (projectData) {
        alert(`🎬 开始顺序播放 ${dateData.monthLabel} 的助眠工程...`);
      } else {
        alert(`该日期暂无保存的工程，请点击上方去创作。`);
      }
    }

    window.onload = initMyPage;
  </script>
</body>
</html>
