<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 - 今晚怎么睡？🌙</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 深夜沉浸渐变背景 */
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 移动端主容器 */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 170px; /* 留出底部星球区域的高度，防止内容重叠 */
      overflow-y: auto;
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    /* 顶部导航与鼓励 */
    .header-my {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-bar-my {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-to-create {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 6px 12px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .title-goodnight {
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      flex: 1;
    }
    .random-quote {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      margin-top: 4px;
      font-style: italic;
    }

    /* 主视频预览区 */
    .draft-display {
      width: 100%;
      height: 200px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .draft-display img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .empty-display-hint {
      position: absolute;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
    }

    /* 日期月球滑动栏 */
    .date-scroll-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scroll-hint {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
    }
    .date-scroll-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 2px;
      scrollbar-width: none;
      align-items: center;
    }
    .date-scroll-track::-webkit-scrollbar { display: none; }

    .moon-date {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.3s ease;
      position: relative;
    }
    .moon-date.active {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    .moon-date .date-num {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
    }
    .moon-date .date-label {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.6);
    }
    .moon-date.active::after {
      content: '✓';
      position: absolute;
      top: -4px;
      right: -4px;
      background: #4ade80;
      color: white;
      font-size: 10px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 🌟🌟 底部星球播放器 (修正白色裂痕与180°翻转) 🌟🌟 */
    .planet-player-wrapper {
      position: fixed;
      bottom: -10px; /* 稍微向下移一点，隐藏底部的黑色边缘 */
      left: 50%;
      transform: translateX(-50%);
      width: 130%; /* 星球稍微超出屏幕边缘，形成天然弧形 */
      max-width: 500px;
      height: 160px; /* 控制可见星球的高度 */
      z-index: 5;
      display: flex;
      justify-content: center;
      overflow: hidden;
      /* 🌟 使用两层背景混合，确保底部完全透明且贴合 */
      background: none;
    }

    .planet-mask-image {
      width: 100%;
      height: 100%;
      background-image: url('planet2.png');
      background-size: cover;
      /* 🌟 核心修改 1：将图片顶部对齐容器顶部 */
      background-position: top center; 
      /* 🌟 核心修改 2：关键！将图片垂直翻转 180°，形成向上的弧线 */
      transform: rotate(180deg);
      
      position: relative;
      display: flex;
      justify-content: center;
      /* 由于图片翻转了，padding 需要加到底部，才能让内容在视觉上靠在星球上 */
      padding-bottom: 30px; 
      align-items: flex-end; /* 让按钮在底部排列 */
    }

    /* 播放按钮 */
    .play-btn-capsule {
      /* 由于父元素旋转了，按钮需要再次反向旋转 180° 才能正常显示文字 */
      transform: rotate(180deg); 
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 10px 24px;
      color: white;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease;
      height: 38px;
    }
    .play-btn-capsule:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 65px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      gap: 4px;
    }
    .nav-item.active {
      color: #ffffff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="header-my">
      <div class="top-bar-my">
        <a href="create.html" class="back-to-create">← 去创作</a>
        <div class="title-goodnight">Good Night</div>
      </div>
      <p class="random-quote" id="random-quote">你很安全，你被爱着，现在可以安心休息</p>
    </header>

    <div class="draft-display" id="draft-display">
      <div class="empty-display-hint">该日期暂无剪辑工程。<br>左右滑动下方月球切换日期。</div>
    </div>

    <div class="date-scroll-section">
      <p class="scroll-hint">左右滑动月球解锁对应日期的视频工程 (保留近10天)</p>
      <div class="date-scroll-track" id="date-scroll-track">
        </div>
    </div>

  </div>

  <div class="planet-player-wrapper">
    <div class="planet-mask-image">
      <button class="play-btn-capsule" onclick="playSelectedDateProject()">播放该日ASMR工程</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span>🌙</span>
      <span>主页</span>
    </a>
    <a href="create.html" class="nav-item">
      <span>＋</span>
      <span>创作</span>
    </a>
    <a href="my.html" class="nav-item active">
      <span>👤</span>
      <span>我的</span>
    </a>
  </nav>

  <script>
    // 鼓励句子库
    const quotes = [
      "好好休息，明天会是新的开始",
      "今天的你已经很努力了，现在该休息了",
      "闭上眼睛，让平静找到你",
      "愿你的梦温柔又美好",
      "你很安全，你被爱着，现在可以安心休息",
      "放下烦恼，拥抱安静的夜晚",
      "宁静的夜晚正在等待你，好梦",
      "让思绪慢下来，让心安静下来"
    ];

    let currentDateIndex = 9; // 默认选中最后一天（今天）
    let availableDates = [];

    // 初始化
    function initMyPage() {
      // 1. 设置随机句子
      const quoteEl = document.getElementById('random-quote');
      quoteEl.innerText = quotes[Math.floor(Math.random() * quotes.length)];

      // 2. 生成近 10 天日期数据
      generateDateMoons();
    }

    // 生成日期月球并设置选中状态
    function generateDateMoons() {
      const track = document.getElementById('date-scroll-track');
      track.innerHTML = ''; // 清空
      
      const today = new Date();
      availableDates = [];

      // 生成近 10 天日期
      for (let i = 9; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        availableDates.push({
          dateObj: d,
          dayNum: d.getDate(),
          monthLabel: (d.getMonth() + 1) + '/' + d.getDate(),
          storageKey: `asmr_project_${d.toISOString().split('T')[0]}` // 对应日期在 localStorage 的键
        });
      }

      // 渲染
      availableDates.forEach((date, idx) => {
        const moon = document.createElement('div');
        moon.className = `moon-date ${idx === currentDateIndex ? 'active' : ''}`;
        moon.onclick = () => selectDateIndex(idx);
        moon.innerHTML = `
          <div class="date-num">${date.dayNum}</div>
          <div class="date-label">${idx === 9 ? '今天' : date.monthLabel}</div>
        `;
        track.appendChild(moon);
      });

      // 加载选定日期的工程数据
      loadProjectForDate(currentDateIndex);
    }

    // 选中日期时的交互
    function selectDateIndex(index) {
      currentDateIndex = index;
      generateDateMoons(); // 重新渲染状态
    }

    // 读取并加载指定日期的视频工程封面图
    function loadProjectForDate(index) {
      const display = document.getElementById('draft-display');
      const dateData = availableDates[index];
      
      // 读取本地工程数据 (在create.html中保存)
      const projectData = localStorage.getItem(dateData.storageKey);

      if (projectData) {
        // 如果有数据，加载封面图 (这里后续可以提取YouTube封面)
        display.innerHTML = '<img src="path/to/project_cover.jpg" alt=" project cover">';
      } else {
        // 无数据展示提示
        display.innerHTML = `<div class="empty-display-hint">
          ${dateData.monthLabel}该日期暂无剪辑工程。<br>去“创作”页面剪辑并保存一个吧！
        </div>`;
      }
    }

    // 播放指定日期的工程
    function playSelectedDateProject() {
      const dateData = availableDates[currentDateIndex];
      const projectData = localStorage.getItem(dateData.storageKey);

      if (projectData) {
        alert(`🎬 开始顺序播放 ${dateData.monthLabel} 的助眠工程...`);
        // 这里可以跳转到播放页面或启动播放器
      } else {
        alert(`该日期暂无保存的工程，请点击上方去创作。`);
      }
    }

    window.onload = initMyPage;
  </script>
</body>
</html>
